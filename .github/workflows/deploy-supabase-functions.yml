name: Deploy Supabase Functions

permissions:
  actions: read
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'scripts/deploy-supabase-functions.py'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Optional space-separated function names to deploy. Leave blank to deploy all functions.'
        required: false
        default: ''

concurrency:
  group: deploy-supabase-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Retain the health signal for diagnostics; deployment does not gate on it.
  kill-switch-preflight:
    uses: ./.github/workflows/kill-switch-preflight.yml
    with:
      status_source: supabase

  slack-notify-start:
    needs: kill-switch-preflight
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/slack-notify-status.yml
    with:
      mode: start
      workflow_name: Deploy Supabase Functions
      job_name: deploy
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref_name: ${{ github.ref_name }}
      sha: ${{ github.sha }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      INCIDENT_IO_WEBHOOK_URL: ${{ secrets.INCIDENT_IO_WEBHOOK_URL }}
      INCIDENT_IO_WEBHOOK_TOKEN: ${{ secrets.INCIDENT_IO_WEBHOOK_TOKEN }}

  deploy:
    needs:
      - kill-switch-preflight
      - slack-notify-start
    # Publishing a reviewed deployment is independent of the application kill switch.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require trusted production ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$DEPLOY_REF" = "refs/heads/main" || {
            echo "Production deployments must run from refs/heads/main (received $DEPLOY_REF)." >&2
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          REQUESTED_FUNCTIONS: ${{ github.event.inputs.functions || '' }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_FUNCTIONS" ]; then
            python3 ./scripts/deploy-supabase-functions.py --project-ref "$SUPABASE_PROJECT_REF" $REQUESTED_FUNCTIONS
          else
            python3 ./scripts/deploy-supabase-functions.py --project-ref "$SUPABASE_PROJECT_REF"
          fi

  slack-notify-finish:
    needs:
      - slack-notify-start
      - deploy
    if: ${{ always() && needs.slack-notify-start.result == 'success' && needs.deploy.result != 'skipped' }}
    uses: ./.github/workflows/slack-notify-status.yml
    with:
      mode: finish
      workflow_name: Deploy Supabase Functions
      job_name: deploy
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref_name: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      status: ${{ needs.deploy.result }}
      slack_channel_id: ${{ needs.slack-notify-start.outputs.slack_channel_id }}
      slack_message_ts: ${{ needs.slack-notify-start.outputs.slack_message_ts }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      INCIDENT_IO_WEBHOOK_URL: ${{ secrets.INCIDENT_IO_WEBHOOK_URL }}
      INCIDENT_IO_WEBHOOK_TOKEN: ${{ secrets.INCIDENT_IO_WEBHOOK_TOKEN }}

  incidentio-notify-failure:
    needs:
      - deploy
    if: ${{ always() && (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled') }}
    uses: ./.github/workflows/incidentio-workflow-alert.yml
    with:
      status: ${{ needs.deploy.result }}
      severity: high
      workflow_name: Deploy Supabase Functions
      job_name: deploy
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      repository: ${{ github.repository }}
      branch: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      environment: production
    secrets:
      INCIDENT_IO_WEBHOOK_URL: ${{ secrets.INCIDENT_IO_WEBHOOK_URL }}
      INCIDENT_IO_WEBHOOK_TOKEN: ${{ secrets.INCIDENT_IO_WEBHOOK_TOKEN }}
