name = "itemtraxx-edge-proxy"
main = "src/index.ts"
compatibility_date = "2026-02-11"
workers_dev = false
preview_urls = false

[placement]
mode = "smart"

# Persist Worker invocation and console logs in Cloudflare Workers Logs.
# Keep full sampling for the initial rollout; lower this if traffic volume
# makes log volume or retention cost a concern.
[observability]
enabled = true

  [observability.logs]
  invocation_logs = true
  head_sampling_rate = 1
  persist = true

[vars]
# Production, explicitly routed promotion, and development surfaces only. The
# demo workspace is explicitly allowed; other reserved/test workspace slugs remain denied.
ALLOWED_ORIGINS = "https://itemtraxx.com,https://www.itemtraxx.com,https://status.itemtraxx.com,https://internal.itemtraxx.com,https://app.itemtraxx.com,https://dennis-dev.itemtraxx.com,https://leo-dev.itemtraxx.com,https://dev.itemtraxx.com,https://preview.itemtraxx.com,https://staging.itemtraxx.com,https://itxdemo.app.itemtraxx.com"
TRUST_LOCAL_ORIGINS = "false"
SESSION_COOKIE_SAMESITE = "lax"
# Optional hard allowlist of function names (comma-separated).
ALLOWED_FUNCTIONS = "workspace-login,checkoutReturn,checkout-borrower-lookup,offline-checkout,admin-item-mutate,admin-borrower-mutate,admin-ops,system-status,super-workspace-mutate,super-admin-mutate,super-dashboard,super-item-mutate,super-borrower-mutate,super-logs-query,super-ops,contact-sales-submit,contact-support-submit,client-error-report,consent-record,job-worker,login-notify,intercom-jwt,super-auth-verify,workspace-admin-mutate,privileged-step-up"
ITX_ITEMTRAXX_KILLSWITCH_ENABLED = "false"
SENTRY_ENVIRONMENT = "production"

# Optional: enables maintenance-mode fallback state when system-status
# cannot read Supabase during outages/upgrades.
[[kv_namespaces]]
binding = "MAINTENANCE_FALLBACK_KV"
id = "09542de7b51b4edcb189f38addcba602"

[[ratelimits]]
name = "SESSION_EXCHANGE_RATE_LIMITER"
namespace_id = "2026061101"
  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "SESSION_REFRESH_RATE_LIMITER"
namespace_id = "2026061102"
  [ratelimits.simple]
  limit = 60
  period = 60

[[routes]]
pattern = "edge.itemtraxx.com"
zone_name = "itemtraxx.com"
custom_domain = true

[[routes]]
pattern = "mta-sts.itemtraxx.com"
zone_name = "itemtraxx.com"
custom_domain = true
