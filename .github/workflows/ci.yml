name: CI

permissions:
  actions: read
  contents: read
  pull-requests: read

on:
  pull_request:
  push:
    branches:
      - main
      - preview
      - staging
  workflow_dispatch:
    inputs:
      deno_lock_sync:
        description: Internal full validation dispatch after a signed Deno lock update.
        required: false
        type: boolean
        default: false
      deno_lock_sync_pr_number:
        description: Same-repository Dependabot PR number associated with the updated lockfile.
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  require-trusted-ref:
    outputs:
      deno_lock_sync: ${{ steps.guard.outputs.deno_lock_sync }}
      deno_lock_sync_base_sha: ${{ steps.guard.outputs.deno_lock_sync_base_sha }}
      deno_lock_sync_head_sha: ${{ steps.guard.outputs.deno_lock_sync_head_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow dispatch ref
        id: guard
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          RUN_ACTOR: ${{ github.actor }}
          DENO_LOCK_SYNC: ${{ inputs.deno_lock_sync }}
          DENO_LOCK_SYNC_PR_NUMBER: ${{ inputs.deno_lock_sync_pr_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$RUN_EVENT" = "workflow_dispatch" ]; then
            if [[ "$RUN_REF" == "refs/heads/main" && "$DENO_LOCK_SYNC" != "true" ]]; then
              exit 0
            fi

            if [[ "$DENO_LOCK_SYNC" != "true" || "$RUN_ACTOR" != "github-actions[bot]" ]]; then
              echo "::error::Manual CI runs must use refs/heads/main; automated Deno lock validation must be dispatched by GitHub Actions."
              exit 1
            fi

            if [[ ! "$RUN_REF" =~ ^refs/heads/.+ ]] || [[ ! "$DENO_LOCK_SYNC_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::The Deno lock validation dispatch did not include a valid base branch and PR number."
              exit 1
            fi

            if ! pull_request_json="$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$DENO_LOCK_SYNC_PR_NUMBER")"; then
              echo "::error::Could not verify the Dependabot PR for automated CI dispatch."
              exit 1
            fi

            base_branch="${RUN_REF#refs/heads/}"
            if ! jq -e --arg base_branch "$base_branch" --arg repository "$GITHUB_REPOSITORY" '
              .state == "open" and
              .user.login == "dependabot[bot]" and
              .head.repo.full_name == $repository and
              .base.ref == $base_branch
            ' <<< "$pull_request_json" >/dev/null; then
              echo "::error::The workflow dispatch does not match an open same-repository Dependabot PR targeting the dispatched base branch."
              exit 1
            fi

            base_sha="$(jq -er '.base.sha | select(test("^[0-9a-f]{40}$"))' <<< "$pull_request_json")"
            head_sha="$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' <<< "$pull_request_json")"
            echo "deno_lock_sync=true" >> "$GITHUB_OUTPUT"
            echo "deno_lock_sync_base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "deno_lock_sync_head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          fi

  kill-switch-preflight:
    # GitHub-hosted runners receive a Cloudflare challenge (HTTP 403) from
    # the edge system-status URL. Use the direct Supabase origin while
    # keeping CI fail-closed on an unknown state.
    needs: require-trusted-ref
    uses: ./.github/workflows/kill-switch-preflight.yml
    with:
      status_source: supabase

  slack-notify-start:
    needs:
      - require-trusted-ref
      - kill-switch-preflight
    if: ${{ github.event_name != 'pull_request' && needs.require-trusted-ref.outputs.deno_lock_sync != 'true' }}
    uses: ./.github/workflows/slack-notify-status.yml
    with:
      mode: start
      workflow_name: CI
      job_name: validate
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref_name: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      incident_alerts_enabled: false
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  validate:
    needs:
      - require-trusted-ref
      - kill-switch-preflight
      - slack-notify-start
    if: ${{ always() && needs.require-trusted-ref.result == 'success' && needs.kill-switch-preflight.outputs.active == 'false' && (needs.slack-notify-start.result == 'success' || needs.slack-notify-start.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.require-trusted-ref.outputs.deno_lock_sync_head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # package.json requires Node 24.x; jsdom 30 also requires 24.15+.
          node-version: 24.18.0
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.x
          cache: true

      - name: Install dependencies
        # Avoid flaky native/CLI postinstall downloads during CI (for example
        # the Supabase CLI). The shared install serves every suite below.
        run: npm ci --ignore-scripts

      - name: Check CodeQL permission isolation
        if: ${{ !cancelled() }}
        run: node --test scripts/ci-codeql-isolation.test.mjs

      # Core validation runs on pull requests, protected branch pushes, and
      # authorized workflow dispatches.
      - name: Verify env parity
        if: ${{ !cancelled() }}
        run: bash ./scripts/check-env-parity.sh

      - name: Check edge-function coverage
        if: ${{ !cancelled() }}
        run: npm run devops:check:edge-coverage

      - name: Check documented empty catches
        if: ${{ !cancelled() }}
        run: npm run devops:check:empty-catches

      - name: Check edge contract drift
        if: ${{ !cancelled() }}
        run: npm run devops:check:edge-contract-drift

      - name: Check edge action contract parity
        if: ${{ !cancelled() }}
        run: npm run devops:check:edge-action-parity

      - name: Check Supabase function graph with frozen Deno lock
        if: ${{ !cancelled() }}
        run: deno check --node-modules-dir=none --frozen supabase/functions/super-ops/index.ts supabase/functions/super-workspace-mutate/index.ts supabase/functions/admin-ops/index.ts

      - name: Deno test coverage gate (Supabase functions + Cloudflare edge-proxy)
        if: ${{ !cancelled() }}
        run: npm run devops:check:deno-coverage

      - name: Check SQL and function coupling
        if: ${{ !cancelled() }}
        env:
          ITX_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (needs.require-trusted-ref.outputs.deno_lock_sync == 'true' && needs.require-trusted-ref.outputs.deno_lock_sync_base_sha) || github.event.before }}
          ITX_DIFF_HEAD: ${{ needs.require-trusted-ref.outputs.deno_lock_sync_head_sha || github.sha }}
        run: npm run devops:check:sql-coupling

      - name: Clean dist
        if: ${{ !cancelled() }}
        run: rm -rf dist artifacts

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Test prerendered public content
        if: ${{ !cancelled() }}
        run: npm run test:prerender

      - name: Check public CSS boundary
        if: ${{ !cancelled() }}
        run: npm run perf:css-boundary

      - name: Typecheck Cloudflare Worker
        if: ${{ !cancelled() }}
        run: npm run worker:typecheck

      - name: Test frontend units (Vitest)
        if: ${{ !cancelled() }}
        # Unit tests need configuration to import the Supabase client and to
        # exercise authenticated requests. These are non-secret placeholders;
        # the suite mocks network calls and never contacts these origins.
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-test-anon-key
          VITE_EDGE_PROXY_URL: https://proxy.example.com
        run: npm run test:unit

      - name: Check initial JavaScript budget
        if: ${{ !cancelled() }}
        run: npm run perf:initial

      - name: Check bundle budget
        if: ${{ !cancelled() }}
        run: npm run perf:budget

      - name: Check image budget
        if: ${{ !cancelled() }}
        run: npm run perf:images

      - name: Generate perf report
        if: ${{ !cancelled() }}
        run: npm run perf:report

      - name: Upload perf report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-report
          path: artifacts/perf-report.json
          if-no-files-found: ignore
          retention-days: 14

      # Security validation shares the already-installed dependency tree but
      # remains a separate, clearly labelled gate in this single CI check.
      - name: Run security gate
        if: ${{ !cancelled() }}
        run: npm run security:gate

      - name: Generate SBOM
        if: ${{ !cancelled() }}
        run: npm run security:sbom

      - name: Upload SBOM artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      # E2E validation shares the Node install and retains its browser cache
      # and report artifact.
      - name: Cache Playwright browsers
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        if: ${{ !cancelled() }}
        run: |
          timeout 180s npx playwright install-deps chromium || {
            echo "::warning::Playwright system dependency install failed or timed out; continuing so E2E can verify whether the runner already has the required libraries."
          }

      - name: Run E2E tests
        if: ${{ !cancelled() }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      # Failure alerting runs in the trusted workflow_run workflow so this
      # PR-controlled runner never receives incident.io credentials.

  slack-notify-finish:
    needs:
      - require-trusted-ref
      - kill-switch-preflight
      - slack-notify-start
      - validate
    # Always finish the single CI status message when the start message exists.
    # A kill-switch block is reported in that same message instead of creating
    # a second, normally skipped, notification check.
    if: ${{ always() && github.event_name != 'pull_request' && needs.require-trusted-ref.outputs.deno_lock_sync != 'true' && needs.require-trusted-ref.result == 'success' && needs.slack-notify-start.result == 'success' }}
    uses: ./.github/workflows/slack-notify-status.yml
    with:
      mode: finish
      workflow_name: CI
      job_name: validate
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref_name: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      status: ${{ needs.validate.result == 'success' && 'success' || needs.validate.result == 'failure' && 'failure' || needs.validate.result == 'cancelled' && 'cancelled' || needs.kill-switch-preflight.outputs.active == 'true' && 'success' || 'failure' }}
      status_message: ${{ needs.validate.result == 'skipped' && needs.kill-switch-preflight.outputs.active == 'true' && format('Intentionally skipped because the ItemTraxx kill switch is active. {0}', needs.kill-switch-preflight.outputs.message) || needs.validate.result == 'skipped' && format('Validation was blocked because kill-switch preflight returned {0}. {1}', needs.kill-switch-preflight.outputs.active, needs.kill-switch-preflight.outputs.message) || '' }}
      slack_channel_id: ${{ needs.slack-notify-start.outputs.slack_channel_id }}
      slack_message_ts: ${{ needs.slack-notify-start.outputs.slack_message_ts }}
      incident_alerts_enabled: false
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
