name: Synthetic Probes (Hub)

permissions: {}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

jobs:
  require-trusted-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted ref for manual runs
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RUN_EVENT" = "workflow_dispatch" ]; then
            test "$RUN_REF" = "refs/heads/main" || {
              echo "Secret-bearing synthetic probe runs must use refs/heads/main (received $RUN_REF)." >&2
              exit 1
            }
          fi

  probes:
    needs: require-trusted-ref
    uses: ItemTraxxCo/devops/.github/workflows/reusable-synthetic-probes.yml@fc9f2c08e50965b0a5fa2db9b57ff367da75f699
    with:
      hub_ref: fc9f2c08e50965b0a5fa2db9b57ff367da75f699
      # GitHub-hosted runners are challenged by Cloudflare's managed firewall
      # before the public edge can return an application response. Keep this
      # required check on the origin health signal; Deployment Health covers
      # the public routes separately with challenge-aware handling.
      probes_config: >-
        {"statusUrl":"https://mlaspkufocikfcbjgpof.supabase.co/functions/v1/system-status","origin":"https://itemtraxx.com","probes":[{"name":"origin-system-status","url":"https://mlaspkufocikfcbjgpof.supabase.co/functions/v1/system-status","headers":{"Accept":"application/json"},"expect":{"statusRange":[200,299]},"bodyContains":"kill_switch","attempts":3,"allowKillSwitchSkip":true},{"name":"origin-contact-sales-validation","url":"https://mlaspkufocikfcbjgpof.supabase.co/functions/v1/contact-sales-submit","method":"POST","body":"{\"plan\":\"core\"}","expect":{"statusRange":[200,499]},"attempts":3,"allowKillSwitchSkip":true}]}

  slack-notify-failure:
    needs:
      - require-trusted-ref
      - probes
    if: ${{ always() && needs.require-trusted-ref.result == 'success' && (needs.probes.result == 'failure' || needs.probes.result == 'cancelled') }}
    uses: ./.github/workflows/slack-notify-failure.yml
    with:
      workflow_name: Synthetic Probes (Hub)
      job_name: probes
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref_name: ${{ github.ref_name }}
      sha: ${{ github.sha }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      INCIDENT_IO_WEBHOOK_URL: ${{ secrets.INCIDENT_IO_WEBHOOK_URL }}
      INCIDENT_IO_WEBHOOK_TOKEN: ${{ secrets.INCIDENT_IO_WEBHOOK_TOKEN }}
