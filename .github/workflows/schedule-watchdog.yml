name: Schedule Watchdog

permissions:
  actions: read
  contents: read

on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:

concurrency:
  group: schedule-watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  require-trusted-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted ref for manual runs
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RUN_EVENT" = "workflow_dispatch" ]; then
            test "$RUN_REF" = "refs/heads/main" || {
              echo "Secret-bearing schedule watchdog runs must use refs/heads/main (received $RUN_REF)." >&2
              exit 1
            }
          fi

  kill-switch-preflight:
    needs: require-trusted-ref
    uses: ./.github/workflows/kill-switch-preflight.yml
    with:
      status_source: supabase

  check-stale-schedules:
    needs:
      - require-trusted-ref
      - kill-switch-preflight
    if: ${{ needs.require-trusted-ref.result == 'success' && needs.kill-switch-preflight.outputs.active == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Check scheduled workflow freshness
        id: watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          API_BASE="https://api.github.com/repos/${REPOSITORY}"
          CURRENT_EPOCH="$(date -u +%s)"
          STALE_REPORT=""
          HEARTBEAT_REPORT=""

          fetch_workflow_runs() {
            local workflow_file="$1"
            local url="${API_BASE}/actions/workflows/${workflow_file}/runs?event=schedule&branch=main&status=completed&sort=created&direction=desc&per_page=50"
            local attempt
            local max_attempts=4
            local delay_seconds=5
            local response

            for attempt in $(seq 1 "$max_attempts"); do
              # GitHub's Actions run endpoint can serve an old 200 response; bypass intermediary caches.
              if response="$(curl -fsSL \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Cache-Control: no-cache" \
                -H "Pragma: no-cache" \
                "$url")" && \
                printf '%s' "$response" | jq -e '.workflow_runs | type == "array"' >/dev/null; then
                printf '%s' "$response"
                return 0
              fi

              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "GitHub API request for ${workflow_file} failed on attempt ${attempt}; retrying in ${delay_seconds}s..." >&2
                sleep "$delay_seconds"
                delay_seconds="$(( delay_seconds * 2 ))"
              fi
            done

            echo "GitHub API request for ${workflow_file} failed after ${max_attempts} attempts." >&2
            return 1
          }

          latest_run_timestamps() {
            printf '%s' "$1" | jq -r '
              [
                (.workflow_runs | sort_by(.created_at) | reverse | .[0].created_at // ""),
                (.workflow_runs | map(select(.conclusion == "success")) | sort_by(.created_at) | reverse | .[0].created_at // "")
              ] | @tsv
            '
          }

          check_workflow() {
            local workflow_file="$1"
            local workflow_name="$2"
            local heartbeat_max_age_seconds="$3"
            local success_max_age_seconds="$4"

            local response
            local latest_completed latest_success
            local latest_completed_epoch latest_success_epoch
            local timestamps
            local refresh_attempt=0
            local max_refresh_attempts=2

            while true; do
              response="$(fetch_workflow_runs "$workflow_file")"
              timestamps="$(latest_run_timestamps "$response")"
              IFS=$'\t' read -r latest_completed latest_success <<< "$timestamps"

              if [ -n "$latest_completed" ] && [ -n "$latest_success" ]; then
                latest_completed_epoch="$(python3 -c 'from datetime import datetime; import sys; print(int(datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")).timestamp()))' "$latest_completed")"
                latest_success_epoch="$(python3 -c 'from datetime import datetime; import sys; print(int(datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")).timestamp()))' "$latest_success")"
                if [ $(( CURRENT_EPOCH - latest_completed_epoch )) -le "$heartbeat_max_age_seconds" ] && \
                  [ $(( CURRENT_EPOCH - latest_success_epoch )) -le "$success_max_age_seconds" ]; then
                  break
                fi
              fi

              # A stale-but-valid API snapshot must not become a fatal watchdog alert on the first read.
              if [ "$refresh_attempt" -ge "$max_refresh_attempts" ]; then
                break
              fi

              refresh_attempt="$(( refresh_attempt + 1 ))"
              echo "Freshness response for ${workflow_name} exceeded its threshold or was incomplete; refetching (${refresh_attempt}/${max_refresh_attempts})." >&2
              sleep 2
            done

            if [ -z "$latest_completed" ]; then
              STALE_REPORT="${STALE_REPORT}\n- ${workflow_name}: no completed scheduled runs found"
              return
            fi

            local completed_age_minutes heartbeat_max_age_minutes
            completed_age_minutes="$(( (CURRENT_EPOCH - latest_completed_epoch) / 60 ))"
            heartbeat_max_age_minutes="$(( heartbeat_max_age_seconds / 60 ))"

            if [ $(( CURRENT_EPOCH - latest_completed_epoch )) -gt "$heartbeat_max_age_seconds" ]; then
              HEARTBEAT_REPORT="${HEARTBEAT_REPORT}\n- ${workflow_name}: last completed scheduled run was ${completed_age_minutes} minutes ago (heartbeat threshold ${heartbeat_max_age_minutes} minutes)"
            fi

            if [ -z "$latest_success" ]; then
              STALE_REPORT="${STALE_REPORT}\n- ${workflow_name}: no successful scheduled runs in recent history"
              return
            fi

            local success_age_minutes success_max_age_minutes
            success_age_minutes="$(( (CURRENT_EPOCH - latest_success_epoch) / 60 ))"
            success_max_age_minutes="$(( success_max_age_seconds / 60 ))"

            if [ $(( CURRENT_EPOCH - latest_success_epoch )) -gt "$success_max_age_seconds" ]; then
              STALE_REPORT="${STALE_REPORT}\n- ${workflow_name}: last successful scheduled run was ${success_age_minutes} minutes ago (success threshold ${success_max_age_minutes} minutes)"
            fi
          }

          # heartbeat threshold is warning-only (non-fatal) to reduce alert noise
          # success threshold is the fatal watchdog gate
          check_workflow "async-job-worker.yml" "Async Job Worker" 28800 32400
          check_workflow "synthetic-journeys.yml" "Synthetic Journeys" 28800 32400
          check_workflow "deployment-health.yml" "Deployment Health" 28800 32400
          if [ -n "$HEARTBEAT_REPORT" ]; then
            {
              echo "heartbeat_stale=true"
              echo "heartbeat_report<<EOF"
              printf '%b\n' "$HEARTBEAT_REPORT"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Heartbeat threshold warnings (non-fatal):"
            printf '%b\n' "$HEARTBEAT_REPORT"
          else
            echo "heartbeat_stale=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$STALE_REPORT" ]; then
            {
              echo "stale=true"
              echo "report<<EOF"
              printf '%b\n' "$STALE_REPORT"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Detected stale scheduled workflows:"
            printf '%b\n' "$STALE_REPORT"
            exit 1
          fi

          echo "stale=false" >> "$GITHUB_OUTPUT"
          echo "All scheduled workflows are within freshness thresholds."

      - name: Send Slack watchdog alert
        if: ${{ failure() && steps.watchdog.outputs.stale == 'true' && env.SLACK_WEBHOOK_URL != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT: ${{ steps.watchdog.outputs.report }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -n \
            --arg run_url "$RUN_URL" \
            --arg repo "$REPOSITORY" \
            --arg report "$REPORT" \
            '{
              text: "Scheduled workflow watchdog alert",
              attachments: [
                {
                  color: "#e01e5a",
                  fields: [
                    { title: "Status", value: "Stale scheduled workflows detected", short: false },
                    { title: "Repository", value: $repo, short: false },
                    { title: "Run", value: ("<" + $run_url + "|Open watchdog run>"), short: false },
                    { title: "Details", value: $report, short: false }
                  ],
                  footer: "GitHub Actions"
                }
              ]
            }')"
          curl -fsSL -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD"

      - name: Send Slack heartbeat warning
        if: ${{ steps.watchdog.outputs.heartbeat_stale == 'true' && env.SLACK_WEBHOOK_URL != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT: ${{ steps.watchdog.outputs.heartbeat_report }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -n \
            --arg run_url "$RUN_URL" \
            --arg repo "$REPOSITORY" \
            --arg report "$REPORT" \
            '{
              text: "Scheduled workflow heartbeat warning",
              attachments: [
                {
                  color: "#f2c744",
                  fields: [
                    { title: "Status", value: "Heartbeat threshold exceeded (warning only)", short: false },
                    { title: "Repository", value: $repo, short: false },
                    { title: "Run", value: ("<" + $run_url + "|Open watchdog run>"), short: false },
                    { title: "Details", value: $report, short: false }
                  ],
                  footer: "GitHub Actions"
                }
              ]
            }')"
          curl -fsSL -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD"

  slack-notify-kill-switch-skip:
    needs:
      - require-trusted-ref
      - kill-switch-preflight
      - check-stale-schedules
    if: ${{ always() && needs.require-trusted-ref.result == 'success' && needs.kill-switch-preflight.outputs.active == 'true' && needs.check-stale-schedules.result == 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack kill-switch skip notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          STATUS_MESSAGE: ${{ format('Intentionally skipped because the ItemTraxx kill switch is active. {0}', needs.kill-switch-preflight.outputs.message) }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          PAYLOAD="$(jq -n \
            --arg run_url "$RUN_URL" \
            --arg repo "$REPOSITORY" \
            --arg branch "$REF_NAME" \
            --arg commit "${SHA:0:7}" \
            --arg status_message "$STATUS_MESSAGE" \
            '{
              text: "GitHub Actions run skipped",
              attachments: [
                {
                  color: "#d4a017",
                  fields: [
                    { title: "Status", value: "Skipped", short: true },
                    { title: "Commit", value: ($commit + " (" + $branch + ")"), short: true },
                    if ($status_message != "") then { title: "Message", value: $status_message, short: false } else empty end,
                    { title: "Workflow", value: ("<" + $run_url + "|Schedule Watchdog / check-stale-schedules>"), short: false },
                    { title: "Repository", value: $repo, short: false }
                  ],
                  footer: "GitHub Actions"
                }
              ]
            }')"
          curl -fsSL -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD"

  incidentio-notify-failure:
    needs:
      - require-trusted-ref
      - kill-switch-preflight
      - check-stale-schedules
    if: ${{ always() && needs.require-trusted-ref.result == 'success' && (needs.kill-switch-preflight.outputs.active == 'false' || needs.kill-switch-preflight.outputs.active == 'unknown') && (needs.check-stale-schedules.result == 'failure' || needs.check-stale-schedules.result == 'cancelled') }}
    uses: ./.github/workflows/incidentio-workflow-alert.yml
    with:
      status: ${{ needs.check-stale-schedules.result }}
      severity: high
      workflow_name: Schedule Watchdog
      job_name: check-stale-schedules
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      repository: ${{ github.repository }}
      branch: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      environment: production
    secrets:
      INCIDENT_IO_WEBHOOK_URL: ${{ secrets.INCIDENT_IO_WEBHOOK_URL }}
      INCIDENT_IO_WEBHOOK_TOKEN: ${{ secrets.INCIDENT_IO_WEBHOOK_TOKEN }}
