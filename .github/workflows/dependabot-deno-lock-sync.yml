name: Deno Lock Sync

# Dependabot PRs may update npm dependencies without refreshing deno.lock.
# Keep the auto-write path limited to same-repository Dependabot PRs initiated
# by Dependabot. GitHub only exposes Dependabot secrets on Dependabot-triggered
# runs; a human rerun of a Dependabot PR must not enter the signing path. After
# syncing, validate the new head in this pull_request run so its caches remain
# scoped to the PR instead of the default branch.

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: deno-lock-sync-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    # The write path is limited to Dependabot PRs from this repository.
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
          github.actor == 'dependabot[bot]' &&
          github.triggering_actor == 'dependabot[bot]' &&
          github.run_attempt == 1 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == 'dependabot[bot]')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    outputs:
      updated_head_sha: ${{ steps.updated-head.outputs.sha }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.x
          cache: true

      - name: Regenerate deno.lock from package.json
        # Keep Deno's 24-hour minimum dependency age enabled. If a Dependabot
        # version is too new to resolve within that window, wait for the window
        # to pass instead of bypassing the age gate.
        run: deno install --lockfile-only --min-dep-age=P1D

      - name: Align mismatched direct versions with npm lock
        id: npm-parity
        env:
          DENO_LOCK_SYNC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/sync-npm-deno-lock-parity.mjs --fix

      - name: Regenerate deno.lock after aligning versions
        if: ${{ steps.npm-parity.outputs.fixed == 'true' }}
        run: deno install --lockfile-only --min-dep-age=P1D

      - name: Verify deno.lock is valid
        run: deno install --lockfile-only --frozen --min-dep-age=P1D

      - name: Verify changed npm and Deno versions match
        env:
          DENO_LOCK_SYNC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/sync-npm-deno-lock-parity.mjs

      - name: Detect lockfile changes
        id: lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json deno.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load SSH signing key
        if: ${{ github.event_name == 'pull_request' && steps.lockfile.outputs.changed == 'true' }}
        env:
          ITX_DENO_LOCK_SYNC_SSH_SIGNING_KEY: ${{ secrets.ITX_DENO_LOCK_SYNC_SSH_SIGNING_KEY }}
          ITX_DENO_LOCK_SYNC_SSH_SIGNING_KEY_PASSPHRASE: ${{ secrets.ITX_DENO_LOCK_SYNC_SSH_SIGNING_KEY_PASSPHRASE }}
          EXPECTED_SIGNING_KEY_FINGERPRINT: ${{ vars.ITX_DENO_LOCK_SYNC_SSH_SIGNING_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ -z "$ITX_DENO_LOCK_SYNC_SSH_SIGNING_KEY" ]]; then
            echo "::error::Configure ITX_DENO_LOCK_SYNC_SSH_SIGNING_KEY as a Dependabot secret. It must be the dedicated signing key registered to the ItemTraxx Deno Lock Sync bot identity. If encrypted, also configure ITX_DENO_LOCK_SYNC_SSH_SIGNING_KEY_PASSPHRASE as a Dependabot secret."
            exit 1
          fi
          if [[ -z "$EXPECTED_SIGNING_KEY_FINGERPRINT" ]]; then
            echo "::error::Configure the repository Actions variable ITX_DENO_LOCK_SYNC_SSH_SIGNING_KEY_FINGERPRINT with the SHA256 fingerprint of the dedicated bot signing key."
            exit 1
          fi

          key_file="$RUNNER_TEMP/itx-git-signing-key"
          askpass_file="$RUNNER_TEMP/itx-git-signing-askpass"
          public_key_file="$RUNNER_TEMP/itx-git-signing-key.pub"
          allowed_signers_file="$RUNNER_TEMP/itx-git-allowed-signers"
          cleanup() {
            rm -f "$key_file" "$askpass_file"
          }
          trap cleanup EXIT

          umask 077
          printf '%s\n' "$ITX_DENO_LOCK_SYNC_SSH_SIGNING_KEY" > "$key_file"
          cat > "$askpass_file" <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$ITX_DENO_LOCK_SYNC_SSH_SIGNING_KEY_PASSPHRASE"
          ASKPASS
          chmod 700 "$askpass_file"

          eval "$(ssh-agent -s)" >/dev/null
          DISPLAY=:1 SSH_ASKPASS="$askpass_file" SSH_ASKPASS_REQUIRE=force \
            ssh-add "$key_file" < /dev/null

          if ! ssh-add -l -E sha256 | awk -v expected="$EXPECTED_SIGNING_KEY_FINGERPRINT" '$2 == expected { found = 1 } END { exit !found }'; then
            echo "::error::The loaded SSH key does not match the configured Deno Lock Sync bot fingerprint."
            exit 1
          fi

          mapfile -t loaded_keys < <(ssh-add -L)
          if [[ "${#loaded_keys[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one SSH signing key in the workflow agent."
            exit 1
          fi
          printf '%s\n' "${loaded_keys[0]}" > "$public_key_file"
          printf '%s %s\n' "noreply@itemtraxx.com" "${loaded_keys[0]}" > "$allowed_signers_file"

          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
            echo "ITX_GIT_SIGNING_PUBLIC_KEY_FILE=$public_key_file"
            echo "ITX_GIT_ALLOWED_SIGNERS_FILE=$allowed_signers_file"
          } >> "$GITHUB_ENV"

      - name: Configure SSH-signed Git commits
        if: ${{ github.event_name == 'pull_request' && steps.lockfile.outputs.changed == 'true' }}
        run: |
          git config --local user.name "ItemTraxx Deno Lock Sync"
          git config --local user.email "noreply@itemtraxx.com"
          git config --local gpg.format ssh
          git config --local user.signingkey "$ITX_GIT_SIGNING_PUBLIC_KEY_FILE"
          git config --local gpg.ssh.allowedSignersFile "$ITX_GIT_ALLOWED_SIGNERS_FILE"
          git config --local commit.gpgsign true

      - name: Commit signed npm and Deno lock sync
        if: ${{ github.event_name == 'pull_request' && steps.lockfile.outputs.changed == 'true' }}
        run: |
          git add -- package.json package-lock.json deno.lock
          # Ignore hooks left by earlier PR code; only this workflow creates the signed commit.
          commit_hooks="$(mktemp -d "$RUNNER_TEMP/itx-deno-lock-sync-commit-hooks.XXXXXX")"
          trap 'rm -rf "$commit_hooks"' EXIT
          git -c "core.hooksPath=$commit_hooks" commit -S \
            -m "chore(deps): sync npm and Deno lockfiles" \
            -m "Generated and validated by the Deno Lock Sync workflow."
          git verify-commit HEAD

      - name: Push signed lockfile update
        if: ${{ github.event_name == 'pull_request' && steps.lockfile.outputs.changed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: ${{ github.head_ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$SYNC_BRANCH" >/dev/null
          git fetch --no-tags origin "refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
          remote_head="$(git rev-parse "refs/remotes/origin/$SYNC_BRANCH")"
          parent_head="$(git rev-parse HEAD^)"
          if [[ "$remote_head" != "$EXPECTED_HEAD_SHA" || "$parent_head" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::The Dependabot PR head changed before the lockfile update could be pushed."
            exit 1
          fi
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 --wrap=0)"
          hook_dir="$(mktemp -d "$RUNNER_TEMP/itx-deno-lock-sync-hooks.XXXXXX")"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git show "$EXPECTED_BASE_SHA:scripts/deno-lock-sync-pre-push.sh" > "$hook_dir/pre-push"
          chmod 700 "$hook_dir/pre-push"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" \
            -c "core.hooksPath=$hook_dir" \
            push origin "HEAD:refs/heads/$SYNC_BRANCH"

      - name: Record updated PR head SHA
        id: updated-head
        if: ${{ github.event_name == 'pull_request' && steps.lockfile.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  kill-switch-preflight:
    needs: sync
    if: ${{ needs.sync.outputs.updated_head_sha != '' }}
    uses: ./.github/workflows/kill-switch-preflight.yml
    with:
      status_source: supabase

  validate:
    needs:
      - sync
      - kill-switch-preflight
    if: ${{ needs.sync.outputs.updated_head_sha != '' && needs.kill-switch-preflight.outputs.active == 'false' }}
    uses: ./.github/workflows/ci-validation.yml
    with:
      ref: ${{ needs.sync.outputs.updated_head_sha }}
      diff_base_sha: ${{ github.event.pull_request.base.sha }}
      diff_head_sha: ${{ needs.sync.outputs.updated_head_sha }}
