name: Deno Lock Sync

# Any npm dependency bump (Dependabot or manual) touches package.json /
# package-lock.json but may not update deno.lock. This workflow verifies the
# generated Deno lock and fails with a diff when a maintainer must refresh it.
# It does not push or commit: repository automation cannot satisfy this
# project's local SSH-signing policy without the signing key.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
  push:
    paths:
      - package.json
      - package-lock.json

concurrency:
  group: deno-lock-sync-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    # Fork branches are not present in the base repository checkout.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.x
          cache: true

      - name: Regenerate deno.lock from package.json
        # --min-dep-age=0 disables Deno's minimum-dependency-age gate, which would
        # otherwise refuse to lock versions published <24h ago and silently no-op —
        # exactly the case that matters, since Dependabot bumps to just-published
        # versions. Safe here: the target versions are already resolved and pinned by
        # npm in package-lock.json, so syncing deno.lock to match is format parity,
        # not a new trust decision.
        run: deno install --lockfile-only --min-dep-age=0

      - name: Verify deno.lock is now in sync
        run: deno install --lockfile-only --frozen --min-dep-age=0

      - name: Require a signed lockfile update
        run: |
          if git diff --quiet -- deno.lock; then
            echo "deno.lock already in sync — nothing to commit."
            exit 0
          fi
          {
            echo "### Deno lockfile needs a signed update"
            echo
            echo "Run `deno install --lockfile-only --min-dep-age=0`, review the resulting `deno.lock`, and commit it with the repository's local SSH signing key."
            echo
            echo '```diff'
            git diff -- deno.lock
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
