name: Strix Security Scan

permissions:
  contents: read

on:
  pull_request:
    branches:
      - preview
  workflow_dispatch:

concurrency:
  group: strix-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kill-switch-preflight:
    # Scan the promotion PR: staging -> preview.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.base.ref == 'preview' && github.event.pull_request.head.ref == 'staging') }}
    uses: ./.github/workflows/kill-switch-preflight.yml

  strix-security-scan:
    needs: kill-switch-preflight
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event.pull_request.base.ref == 'preview' && github.event.pull_request.head.ref == 'staging')) && needs.kill-switch-preflight.outputs.active != 'true' }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Full history lets Strix resolve the pull-request diff scope reliably.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Strix
        env:
          # Pinned below v1.1.0: Caido was introduced in v1.1.0 and its sandbox
          # bootstrap race ("Could not acquire a connection to the database")
          # 500s all outbound sandbox traffic, including the LLM warm-up call.
          # See https://github.com/usestrix/strix/issues/830.
          STRIX_VERSION: 1.0.4
          # SHA-256 published for strix-1.0.4-linux-x86_64.tar.gz.
          STRIX_SHA256: cdde264d2163684ca07168252130df154842d5fb22cd8e00bc6d19f1c74d5dae
        run: |
          strix_dir="$RUNNER_TEMP/strix-${STRIX_VERSION}"
          strix_archive="$strix_dir/strix.tar.gz"
          mkdir -p "$strix_dir/bin"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$strix_archive" \
            "https://github.com/usestrix/strix/releases/download/v${STRIX_VERSION}/strix-${STRIX_VERSION}-linux-x86_64.tar.gz"
          echo "${STRIX_SHA256}  ${strix_archive}" | sha256sum --check --status
          tar -xzf "$strix_archive" -C "$strix_dir"
          install -m 0755 "$strix_dir/strix-${STRIX_VERSION}-linux-x86_64" "$strix_dir/bin/strix"
          echo "$strix_dir/bin" >> "$GITHUB_PATH"

      - name: Debug - NIM reachability from sandbox container
        env:
          LLM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          docker pull ghcr.io/usestrix/strix-sandbox:1.0.0
          docker run --rm -e LLM_API_KEY \
            ghcr.io/usestrix/strix-sandbox:1.0.0 \
            sh -c '
              set -x
              curl -sS --max-time 10 https://ifconfig.me || echo "ifconfig.me curl failed rc=$?"
              echo
              curl -sS -o /dev/null -w "models_endpoint http_code=%{http_code} time=%{time_total}s\n" --max-time 20 \
                https://integrate.api.nvidia.com/v1/models || echo "models endpoint curl failed rc=$?"
              curl -sS -o /tmp/chat_resp.json -w "chat_completions http_code=%{http_code} time=%{time_total}s\n" --max-time 60 \
                -H "Authorization: Bearer $LLM_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"model\":\"deepseek-ai/deepseek-v4-flash\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":8}" \
                https://integrate.api.nvidia.com/v1/chat/completions || echo "chat completions curl failed rc=$?"
              cat /tmp/chat_resp.json || true
            '

      - name: Run Strix security scan
        id: strix-scan
        env:
          STRIX_LLM: nvidia_nim/deepseek-ai/deepseek-v4-flash
          LLM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          STRIX_REASONING_EFFORT: medium
          STRIX_DIFF_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set +e
          set -o pipefail
          strix -n --target ./ --scan-mode quick --scope-mode diff --diff-base "$STRIX_DIFF_BASE" 2>&1 | tee "$RUNNER_TEMP/strix-output.log"
          strix_exit_code="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=$strix_exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare Strix PR summary
        id: strix-summary
        if: always()
        env:
          STRIX_EXIT_CODE: ${{ steps.strix-scan.outputs.exit_code }}
        run: |
          python3 scripts/prepare-strix-pr-summary.py \
            --exit-code "$STRIX_EXIT_CODE" \
            --output "$RUNNER_TEMP/strix-pr-comment.md"
          echo "comment_path=$RUNNER_TEMP/strix-pr-comment.md" >> "$GITHUB_OUTPUT"

      - name: Publish Strix PR summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          STRIX_COMMENT_PATH: ${{ steps.strix-summary.outputs.comment_path }}
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync(process.env.STRIX_COMMENT_PATH, "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" &&
              comment.body?.includes("<!-- itemtraxx-strix-security-scan -->")
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              return;
            }

            await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Upload Strix results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: strix-results-${{ github.run_id }}
          path: strix_runs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail on Strix findings or execution error
        if: ${{ always() && steps.strix-scan.outputs.exit_code != '0' }}
        run: exit "${{ steps.strix-scan.outputs.exit_code }}"
