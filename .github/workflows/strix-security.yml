name: Strix Security Scan

permissions:
  contents: read

on:
  pull_request:
    branches:
      - preview
  workflow_dispatch:

concurrency:
  group: strix-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  require-trusted-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted ref for manual scans
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$RUN_REF" = "refs/heads/main" || {
            echo "Secret-bearing Strix scans must use refs/heads/main (received $RUN_REF)." >&2
            exit 1
          }

  kill-switch-preflight:
    # Scan the promotion PR: staging -> preview.
    needs: require-trusted-ref
    if: ${{ needs.require-trusted-ref.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.base.ref == 'preview' && github.event.pull_request.head.ref == 'staging')) }}
    uses: ./.github/workflows/kill-switch-preflight.yml
    with:
      status_source: supabase

  strix-security-scan:
    needs:
      - require-trusted-ref
      - kill-switch-preflight
    # Strix v1.5.1 includes recoverable unknown-tool handling for the
    # ModelBehaviorError reproduced in ItemTraxx CI.
    if: ((needs.require-trusted-ref.result == 'success' && needs.kill-switch-preflight.result == 'success') && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.base.ref == 'preview' && github.event.pull_request.head.ref == 'staging')) && needs.kill-switch-preflight.outputs.active == 'false')
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    # Serializing Strix's agent fan-out needs more wall-clock budget than the
    # previous parallel run, using the full GitHub-hosted runner job limit.
    timeout-minutes: 360

    steps:
      # Full history lets Strix resolve the pull-request diff scope reliably.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Strix
        env:
          STRIX_VERSION: 1.5.1
          # SHA-256 published for strix-1.5.1-linux-x86_64.tar.gz.
          STRIX_SHA256: f898f2913fc470986df3e903403b8b54409dc26c40caf2f8759e08d3814a3322
        run: |
          strix_dir="$RUNNER_TEMP/strix-${STRIX_VERSION}"
          strix_archive="$strix_dir/strix.tar.gz"
          mkdir -p "$strix_dir/bin"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$strix_archive" \
            "https://github.com/usestrix/strix/releases/download/v${STRIX_VERSION}/strix-${STRIX_VERSION}-linux-x86_64.tar.gz"
          echo "${STRIX_SHA256}  ${strix_archive}" | sha256sum --check --status
          tar -xzf "$strix_archive" -C "$strix_dir"
          install -m 0755 "$strix_dir/strix-${STRIX_VERSION}-linux-x86_64" "$strix_dir/bin/strix"
          echo "$strix_dir/bin" >> "$GITHUB_PATH"

      - name: Run Strix security scan
        id: strix-scan
        env:
          STRIX_LLM: nvidia_nim/deepseek-ai/deepseek-v4-pro-0813
          LLM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          STRIX_REASONING_EFFORT: medium
          STRIX_DIFF_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set +e
          set -o pipefail
          # Strix v1.5.1 has no hard max-agent/concurrency flag. Keep the
          # graph at one active child so NVIDIA NIM is not hit by the four-way
          # root/child fan-out seen in the timed-out scan.
          strix -n \
            --target ./ \
            --scan-mode quick \
            --scope-mode diff \
            --diff-base "$STRIX_DIFF_BASE" \
            --instruction "Provider-capacity constraint for this CI scan: serialize agent execution. Keep at most one child agent active at a time. After spawning a child, immediately wait for it to finish before spawning another. Do not spawn grandchildren or multiple children in one turn, and have the root wait instead of doing parallel work while a child is active. Preserve the full authorized diff scope and finish the scan and report." \
            2>&1 | tee "$RUNNER_TEMP/strix-output.log"
          strix_exit_code="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=$strix_exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare Strix PR summary
        id: strix-summary
        if: always()
        env:
          STRIX_EXIT_CODE: ${{ steps.strix-scan.outputs.exit_code }}
        run: |
          python3 scripts/prepare-strix-pr-summary.py \
            --exit-code "$STRIX_EXIT_CODE" \
            --output "$RUNNER_TEMP/strix-pr-comment.md"
          echo "comment_path=$RUNNER_TEMP/strix-pr-comment.md" >> "$GITHUB_OUTPUT"

      - name: Publish Strix PR summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          STRIX_COMMENT_PATH: ${{ steps.strix-summary.outputs.comment_path }}
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync(process.env.STRIX_COMMENT_PATH, "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" &&
              comment.body?.includes("<!-- itemtraxx-strix-security-scan -->")
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              return;
            }

            await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Upload Strix results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: strix-results-${{ github.run_id }}
          path: strix_runs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail on Strix findings or execution error
        if: ${{ always() && steps.strix-scan.outputs.exit_code != '0' }}
        run: exit "${{ steps.strix-scan.outputs.exit_code }}"
