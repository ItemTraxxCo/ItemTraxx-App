name: CI Validation

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      diff_base_sha:
        required: true
        type: string
      diff_head_sha:
        required: true
        type: string

# Validation is split into independent parallel jobs so wall time is bounded
# by the slowest suite (E2E) instead of the sum of every step, and a failure
# in one suite no longer forces every other step to run serially first.
# Every job checks out inputs.ref and pays its own `npm ci` (~10s with the
# shared npm cache). Only e2e-report depends on another job: when E2E fails,
# it merges the shards' blob reports into one `playwright-report` artifact.
#
# The calling job's result (`needs.validate.result` in ci.yml) is failure if
# any job here fails, so Slack/incident wiring is unchanged.

jobs:
  static-checks:
    name: Static checks and Deno tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # SQL/function coupling diffs diff_base_sha..diff_head_sha.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # package.json requires Node 24.x; jsdom 30 also requires 24.15+.
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/edge-proxy/package-lock.json

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.x
          cache: true

      - name: Install dependencies
        # Avoid flaky native/CLI postinstall downloads during CI (for example
        # the Supabase CLI).
        run: npm ci --ignore-scripts

      - name: Install Cloudflare Worker dependencies
        run: npm ci --ignore-scripts --prefix cloudflare/edge-proxy

      # The checks below are each a few seconds, so they keep running after an
      # earlier one fails to report every static failure in one pass.
      - name: Check CodeQL permission isolation
        if: ${{ !cancelled() }}
        run: node --test scripts/ci-codeql-isolation.test.mjs scripts/edge-proxy-audit-contract.test.mjs

      - name: Verify env parity
        if: ${{ !cancelled() }}
        run: bash ./scripts/check-env-parity.sh

      - name: Check edge-function coverage
        if: ${{ !cancelled() }}
        run: npm run devops:check:edge-coverage

      - name: Check documented empty catches
        if: ${{ !cancelled() }}
        run: npm run devops:check:empty-catches

      - name: Check edge contract drift
        if: ${{ !cancelled() }}
        run: npm run devops:check:edge-contract-drift

      - name: Check edge action contract parity
        if: ${{ !cancelled() }}
        run: npm run devops:check:edge-action-parity

      - name: Check Supabase function graph with frozen Deno lock
        if: ${{ !cancelled() }}
        # The _shared security regression tests are type-checked here; the
        # coverage gate below executes them (with --no-check), so the security
        # job no longer runs them a second time.
        run: >-
          deno check --node-modules-dir=none --frozen
          supabase/functions/super-ops/index.ts
          supabase/functions/super-workspace-mutate/index.ts
          supabase/functions/admin-ops/index.ts
          supabase/functions/_shared/cors_test.ts
          supabase/functions/_shared/accountSessions_test.ts
          supabase/functions/_shared/preloginGuards_test.ts
          supabase/functions/_shared/trustedIngress_test.ts

      - name: Deno test coverage gate (Supabase functions + Cloudflare edge-proxy)
        if: ${{ !cancelled() }}
        run: npm run devops:check:deno-coverage

      - name: Check SQL and function coupling
        if: ${{ !cancelled() }}
        env:
          ITX_DIFF_BASE: ${{ inputs.diff_base_sha }}
          ITX_DIFF_HEAD: ${{ inputs.diff_head_sha }}
        run: npm run devops:check:sql-coupling

      - name: Typecheck Cloudflare Worker
        if: ${{ !cancelled() }}
        run: npm run worker:typecheck

  build:
    name: Build and performance budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/edge-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Clean dist
        run: rm -rf dist artifacts

      - name: Build
        run: npm run build

      - name: Test prerendered public content
        run: npm run test:prerender

      - name: Check public CSS boundary
        run: npm run perf:css-boundary

      - name: Check initial JavaScript budget
        run: npm run perf:initial

      - name: Check bundle budget
        run: npm run perf:budget

      - name: Check image budget
        run: npm run perf:images

      - name: Generate perf report
        run: npm run perf:report

      - name: Upload perf report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-report
          path: artifacts/perf-report.json
          if-no-files-found: ignore
          retention-days: 14

  # Vitest spends ~80% of its CI time building a jsdom environment per test
  # file (tests themselves are ~6%), so splitting files across 2 runners
  # roughly halves the job and keeps it below the E2E shards.
  unit-tests:
    name: Frontend unit tests (Vitest ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/edge-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test frontend units (Vitest)
        # Unit tests need configuration to import the Supabase client and to
        # exercise authenticated requests. These are non-secret placeholders;
        # the suite mocks network calls and never contacts these origins.
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-test-anon-key
          VITE_EDGE_PROXY_URL: https://proxy.example.com
          VITEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:unit -- --shard="$VITEST_SHARD"

  security:
    name: Security gate and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/edge-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Cloudflare Worker dependencies
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts --prefix cloudflare/edge-proxy

      - name: Audit Cloudflare Worker dependencies
        if: ${{ !cancelled() }}
        run: |
          npm audit --audit-level=moderate --prefix cloudflare/edge-proxy
          npm audit signatures --prefix cloudflare/edge-proxy

      - name: Run security gate
        if: ${{ !cancelled() }}
        env:
          # The Deno _shared security tests already run in static-checks.
          ITX_SECURITY_SKIP_DENO_TESTS: "1"
        run: npm run security:gate

      # SBOMs are release evidence, not PR gates: nothing consumes the PR
      # artifacts, so generate them only for pushes to protected branches.
      - name: Generate SBOM
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run security:sbom

      - name: Upload SBOM artifact
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      # Syft catalogs the complete repository so this artifact covers the
      # nested edge-proxy npm lock and the Deno lock as well as the app root.
      - name: Generate multi-ecosystem SBOM
        if: ${{ github.event_name != 'pull_request' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # pinned action commit
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/itemtraxx-app-multiroot-sbom.cdx.json
          artifact-name: itemtraxx-app-multiroot-sbom.cdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Validate multi-ecosystem SBOM
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from 'node:fs';

          const sbomPath = 'artifacts/itemtraxx-app-multiroot-sbom.cdx.json';
          const sbomBytes = statSync(sbomPath).size;
          if (sbomBytes === 0) throw new Error('Generated SBOM is empty');

          const sbom = JSON.parse(readFileSync(sbomPath, 'utf8'));
          if (sbom.bomFormat !== 'CycloneDX') {
            throw new Error(`Unexpected SBOM format: ${sbom.bomFormat}`);
          }
          if (!Array.isArray(sbom.components) || sbom.components.length === 0) {
            throw new Error('Generated SBOM has no dependency components');
          }
          if (!sbom.components.some((component) =>
            (component.purl ?? '').startsWith('pkg:npm/'))
          ) {
            throw new Error('SBOM has no npm package components');
          }
          if (!sbom.components.some((component) =>
            (component.purl ?? '').startsWith('pkg:github/'))
          ) {
            throw new Error('SBOM has no GitHub Actions components');
          }

          const rootLock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const edgeLock = JSON.parse(
            readFileSync('cloudflare/edge-proxy/package-lock.json', 'utf8'),
          );
          const denoLock = JSON.parse(readFileSync('deno.lock', 'utf8'));

          function packageNameFromLockPath(lockPath) {
            const segments = lockPath.split('node_modules/').at(-1).split('/');
            return segments[0].startsWith('@')
              ? segments.slice(0, 2).join('/')
              : segments[0];
          }

          function npmLockEntries(lock) {
            return Object.entries(lock.packages ?? {})
              .filter(([lockPath]) => lockPath.includes('node_modules/'))
              .map(([lockPath, pkg]) => ({
                name: packageNameFromLockPath(lockPath),
                version: pkg.version,
                optional: pkg.optional === true,
              }));
          }

          const rootEntries = npmLockEntries(rootLock);
          const edgeEntries = npmLockEntries(edgeLock);
          const rootEntryKeys = new Set(
            rootEntries.map(({ name, version }) => `${name}@${version}`),
          );
          const edgeUnique = edgeEntries.find(
            ({ name, version, optional }) =>
              !optional && !rootEntryKeys.has(`${name}@${version}`),
          );
          if (!edgeUnique) {
            throw new Error('Could not identify an edge-proxy-specific lock entry');
          }

          const allNpmLockEntries = new Set(
            [...rootEntries, ...edgeEntries].map(
              ({ name, version }) => `${name}@${version}`,
            ),
          );
          const denoUnique = Object.keys(denoLock.npm ?? {})
            .map((entry) => {
              const match = entry.match(/^(@[^/]+\/[^@]+|[^@]+)@([^_]+)/);
              return match ? { name: match[1], version: match[2] } : undefined;
            })
            .find(
              (entry) =>
                entry &&
                !allNpmLockEntries.has(`${entry.name}@${entry.version}`),
            );
          if (!denoUnique) {
            throw new Error('Could not identify a Deno-lock-specific npm entry');
          }

          for (const expected of [edgeUnique, denoUnique]) {
            const represented = sbom.components.some(
              (component) =>
                component.name === expected.name &&
                component.version === expected.version,
            );
            if (!represented) {
              throw new Error(
                `SBOM does not represent lock entry ${expected.name}@${expected.version}`,
              );
            }
          }

          console.log(
            `Validated ${sbom.components.length} components in ${sbomPath}; includes edge-proxy and Deno lock entries.`,
          );
          NODE

      - name: Upload multi-ecosystem SBOM artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: itemtraxx-app-multiroot-sbom
          path: artifacts/itemtraxx-app-multiroot-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  # E2E is split across 4 runners. Each shard has ~40s of fixed setup (Node,
  # deps, Chrome, system libs) plus ~1/4 of the ~100s test run (~70s total).
  # Past 4 shards the fixed setup dominates and each extra runner saves ~5s.
  e2e:
    name: End-to-end tests (Playwright ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Keep the other shards running when one fails so the merged report
      # shows every failure, not only the first shard's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/edge-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Resolve once, then install and verify the exact same Chrome for Testing
      # Stable build. The apt-delivered Chrome package can lag CfT metadata.
      - name: Resolve Chrome for Testing Stable version
        id: chrome-stable
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const metadataUrl = 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json';
          const response = await fetch(metadataUrl, { signal: AbortSignal.timeout(15_000) });
          if (!response.ok) {
            throw new Error(`Chrome for Testing metadata request failed with HTTP ${response.status}`);
          }

          const metadata = await response.json();
          const stable = metadata?.channels?.Stable;
          if (typeof stable?.version !== 'string' || !/^\d+\.\d+\.\d+\.\d+$/.test(stable.version)) {
            throw new Error('Chrome for Testing Stable version was unavailable or invalid');
          }

          const download = stable.downloads?.chrome?.find((entry) => entry.platform === 'linux64');
          const downloadUrl = typeof download?.url === 'string' ? new URL(download.url) : null;
          const expectedPath = `/chrome-for-testing-public/${stable.version}/linux64/chrome-linux64.zip`;
          if (
            !downloadUrl ||
            downloadUrl.protocol !== 'https:' ||
            downloadUrl.hostname !== 'storage.googleapis.com' ||
            downloadUrl.pathname !== expectedPath
          ) {
            throw new Error('Chrome for Testing Stable download URL was unavailable or invalid');
          }

          const outputFile = process.env.GITHUB_OUTPUT;
          if (!outputFile) {
            throw new Error('GitHub Actions output file was unavailable');
          }
          appendFileSync(
            outputFile,
            `version=${stable.version}\nurl=${downloadUrl.toString()}\n`,
          );
          NODE

      - name: Install Chrome for Testing Stable
        timeout-minutes: 10
        env:
          CHROME_STABLE_VERSION: ${{ steps.chrome-stable.outputs.version }}
          CHROME_STABLE_URL: ${{ steps.chrome-stable.outputs.url }}
        run: |
          archive="$RUNNER_TEMP/chrome-for-testing.zip"
          browser_dir="$RUNNER_TEMP/chrome-for-testing"
          executable="$browser_dir/chrome-linux64/chrome"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 300 \
            "$CHROME_STABLE_URL" --output "$archive"
          unzip -q "$archive" -d "$browser_dir"
          test -x "$executable"
          echo "CHROME_STABLE_VERSION=$CHROME_STABLE_VERSION" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$executable" >> "$GITHUB_ENV"
          echo "Installed Chrome for Testing Stable $CHROME_STABLE_VERSION"

      - name: Verify Chrome Stable version
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          const expected = process.env.CHROME_STABLE_VERSION;
          const executable = process.env.PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH;
          if (!expected || !executable) {
            throw new Error('Chrome for Testing Stable installation details were unavailable');
          }

          const output = execFileSync(executable, ['--version'], { encoding: 'utf8' }).trim();
          const actual = output.match(/\d+\.\d+\.\d+\.\d+/)?.[0];
          if (!actual) {
            throw new Error(`Could not parse installed Chrome version from: ${output}`);
          }
          if (actual !== expected) {
            throw new Error(`Installed Chrome ${actual} does not match Chrome for Testing Stable ${expected}`);
          }

          console.log(`Verified installed Chrome for Testing Stable ${actual}.`);
          NODE

      # ubuntu-24.04 runners already ship Chrome's shared libraries; install-deps
      # only adds ~21 MB of optional CJK/Thai/Unicode fonts (no test compares
      # screenshots). The Azure apt mirror sometimes stalls on those downloads
      # (one shard hit the 180s timeout), so only call apt when a library is
      # actually missing.
      - name: Install Playwright system dependencies
        run: |
          missing="$(ldd "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" | grep 'not found' || true)"
          if [ -z "$missing" ]; then
            echo "Chrome shared libraries already present; skipping apt install."
            exit 0
          fi
          echo "Chrome is missing shared libraries:"
          echo "$missing"
          timeout 180s npx playwright install-deps chromium || {
            echo "::warning::Playwright system dependency install failed or timed out; continuing so E2E can verify whether the runner already has the required libraries."
          }

      - name: Install Playwright FFmpeg
        run: npx playwright install ffmpeg

      - name: Run E2E tests
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:e2e -- --shard="$E2E_SHARD"

      # Blob reports embed traces, screenshots and videos, so the merged HTML
      # report keeps every failure attachment without uploading test-results.
      - name: Upload Playwright blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 1

  e2e-report:
    name: Merge Playwright reports
    needs: e2e
    # Only failures need a browsable report; skipping this on green runs keeps
    # ~25s of serial merge time off the critical path. Shard blob reports are
    # still uploaded (kept 1 day) if a passing run ever needs inspecting.
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/edge-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download shard blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: |
          if ! compgen -G "all-blob-reports/*.zip" > /dev/null; then
            echo "::warning::No shard produced a blob report; nothing to merge."
            exit 0
          fi
          npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      # Failure alerting runs in the trusted workflow_run workflow so this
      # PR-controlled runner never receives incident.io credentials.
