name: Manage Edge Downtime

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: "Enable or disable the kill switch."
        required: true
        type: choice
        default: disable
        options:
          - enable
          - disable
      message:
        description: "Kill-switch message shown in the blocking response."
        required: false
        default: "Unfortunately ItemTraxx is currently unavailable. We apologize for any inconvenience and are working to restore access as soon as possible. Please see the status page for more information"
      maintenance_enabled:
        description: "Enable or disable maintenance mode at the edge."
        required: true
        type: choice
        default: disable
        options:
          - enable
          - disable
      maintenance_message:
        description: "Maintenance message shown in the blocking response."
        required: false
        default: "Maintenance is currently in progress. Please see the status page for more information."

concurrency:
  group: manage-kill-switch
  cancel-in-progress: false

jobs:
  require-trusted-ref:
    runs-on: ubuntu-24.04
    steps:
      - name: Require trusted ref for manual changes
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$RUN_REF" = "refs/heads/main" || {
            echo "Kill-switch changes must use refs/heads/main (received $RUN_REF)." >&2
            exit 1
          }

  kill-switch-preflight:
    needs: require-trusted-ref
    uses: ./.github/workflows/kill-switch-preflight.yml

  slack-notify-start:
    needs:
      - require-trusted-ref
      - kill-switch-preflight
    uses: ./.github/workflows/slack-notify-status.yml
    with:
      mode: start
      workflow_name: Manage Edge Downtime
      job_name: apply
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref_name: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      incident_alerts_enabled: false
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  apply:
    needs:
      - require-trusted-ref
      - kill-switch-preflight
      - slack-notify-start
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require trusted production ref
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$DEPLOY_REF" = "refs/heads/main" || {
            echo "Production kill-switch changes must run from refs/heads/main (received $DEPLOY_REF)." >&2
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve kill-switch inputs
        id: config
        env:
          INPUT_ENABLED: ${{ github.event.inputs.enabled }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
          INPUT_MAINTENANCE_ENABLED: ${{ github.event.inputs.maintenance_enabled }}
          INPUT_MAINTENANCE_MESSAGE: ${{ github.event.inputs.maintenance_message }}
        run: |
          set -euo pipefail

          if [ "$INPUT_ENABLED" = "enable" ]; then
            killswitch_enabled="true"
          else
            killswitch_enabled="false"
          fi

          if [ "$INPUT_MAINTENANCE_ENABLED" = "enable" ]; then
            maintenance_enabled="true"
          else
            maintenance_enabled="false"
          fi

          killswitch_message="$(printf '%s' "$INPUT_MESSAGE" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')"
          if [ -z "$killswitch_message" ]; then
            killswitch_message="Unfortunately ItemTraxx is currently unavailable. We apologize for any inconvenience and are working to restore access as soon as possible. Please see the status page for more information"
          fi
          maintenance_message="$(printf '%s' "$INPUT_MAINTENANCE_MESSAGE" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')"
          if [ -z "$maintenance_message" ]; then
            maintenance_message="Maintenance is currently in progress. Please see the status page for more information."
          fi

          {
            echo "killswitch_enabled=$killswitch_enabled"
            echo "killswitch_message<<EOF"
            echo "$killswitch_message"
            echo "EOF"
            echo "maintenance_enabled=$maintenance_enabled"
            echo "maintenance_message<<EOF"
            echo "$maintenance_message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sync Supabase kill-switch secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          KILLSWITCH_ENABLED: ${{ steps.config.outputs.killswitch_enabled }}
          KILLSWITCH_MESSAGE: ${{ steps.config.outputs.killswitch_message }}
        run: |
          set -euo pipefail
          npx supabase secrets set \
            "ITX_KILLSWITCH_ENABLED=$KILLSWITCH_ENABLED" \
            "ITX_KILLSWITCH_MESSAGE=$KILLSWITCH_MESSAGE" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --yes

      - name: Deploy Cloudflare worker with kill-switch settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KILLSWITCH_ENABLED: ${{ steps.config.outputs.killswitch_enabled }}
          KILLSWITCH_MESSAGE: ${{ steps.config.outputs.killswitch_message }}
          MAINTENANCE_ENABLED: ${{ steps.config.outputs.maintenance_enabled }}
          MAINTENANCE_MESSAGE: ${{ steps.config.outputs.maintenance_message }}
        run: |
          set -euo pipefail
          ./scripts/deploy-cloudflare-worker.sh \
            --var "ITX_MAINTENANCE_ENABLED:$MAINTENANCE_ENABLED" \
            --var "ITX_MAINTENANCE_MESSAGE:$MAINTENANCE_MESSAGE" \
            --var "ITX_KILLSWITCH_ENABLED:$KILLSWITCH_ENABLED" \
            --var "ITX_KILLSWITCH_MESSAGE:$KILLSWITCH_MESSAGE" \
            --message "Manage edge downtime from GitHub Actions"

  slack-notify-finish:
    needs:
      - require-trusted-ref
      - slack-notify-start
      - apply
    if: ${{ always() && needs.require-trusted-ref.result == 'success' && needs.slack-notify-start.result == 'success' && needs.apply.result != 'skipped' }}
    uses: ./.github/workflows/slack-notify-status.yml
    with:
      mode: finish
      workflow_name: Manage Edge Downtime
      job_name: apply
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref_name: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      status: ${{ needs.apply.result }}
      slack_channel_id: ${{ needs.slack-notify-start.outputs.slack_channel_id }}
      slack_message_ts: ${{ needs.slack-notify-start.outputs.slack_message_ts }}
      incident_alerts_enabled: false
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
