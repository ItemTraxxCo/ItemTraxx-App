name: CI Validation

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      diff_base_sha:
        required: true
        type: string
      diff_head_sha:
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # package.json requires Node 24.x; jsdom 30 also requires 24.15+.
          node-version: 24.22.1
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.x
          cache: true

      - name: Install dependencies
        # Avoid flaky native/CLI postinstall downloads during CI (for example
        # the Supabase CLI). The shared install serves every suite below.
        run: npm ci --ignore-scripts

      - name: Install Cloudflare Worker dependencies
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts --prefix cloudflare/edge-proxy

      - name: Audit Cloudflare Worker dependencies
        if: ${{ !cancelled() }}
        run: |
          npm audit --audit-level=moderate --prefix cloudflare/edge-proxy
          npm audit signatures --prefix cloudflare/edge-proxy

      - name: Check CodeQL permission isolation
        if: ${{ !cancelled() }}
        run: node --test scripts/ci-codeql-isolation.test.mjs scripts/edge-proxy-audit-contract.test.mjs

      # Core validation runs on pull requests and protected branch pushes.
      - name: Verify env parity
        if: ${{ !cancelled() }}
        run: bash ./scripts/check-env-parity.sh

      - name: Check edge-function coverage
        if: ${{ !cancelled() }}
        run: npm run devops:check:edge-coverage

      - name: Check documented empty catches
        if: ${{ !cancelled() }}
        run: npm run devops:check:empty-catches

      - name: Check edge contract drift
        if: ${{ !cancelled() }}
        run: npm run devops:check:edge-contract-drift

      - name: Check edge action contract parity
        if: ${{ !cancelled() }}
        run: npm run devops:check:edge-action-parity

      - name: Check Supabase function graph with frozen Deno lock
        if: ${{ !cancelled() }}
        run: deno check --node-modules-dir=none --frozen supabase/functions/super-ops/index.ts supabase/functions/super-workspace-mutate/index.ts supabase/functions/admin-ops/index.ts

      - name: Deno test coverage gate (Supabase functions + Cloudflare edge-proxy)
        if: ${{ !cancelled() }}
        run: npm run devops:check:deno-coverage

      - name: Check SQL and function coupling
        if: ${{ !cancelled() }}
        env:
          ITX_DIFF_BASE: ${{ inputs.diff_base_sha }}
          ITX_DIFF_HEAD: ${{ inputs.diff_head_sha }}
        run: npm run devops:check:sql-coupling

      - name: Clean dist
        if: ${{ !cancelled() }}
        run: rm -rf dist artifacts

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Test prerendered public content
        if: ${{ !cancelled() }}
        run: npm run test:prerender

      - name: Check public CSS boundary
        if: ${{ !cancelled() }}
        run: npm run perf:css-boundary

      - name: Typecheck Cloudflare Worker
        if: ${{ !cancelled() }}
        run: npm run worker:typecheck

      - name: Test frontend units (Vitest)
        if: ${{ !cancelled() }}
        # Unit tests need configuration to import the Supabase client and to
        # exercise authenticated requests. These are non-secret placeholders;
        # the suite mocks network calls and never contacts these origins.
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-test-anon-key
          VITE_EDGE_PROXY_URL: https://proxy.example.com
        run: npm run test:unit

      - name: Check initial JavaScript budget
        if: ${{ !cancelled() }}
        run: npm run perf:initial

      - name: Check bundle budget
        if: ${{ !cancelled() }}
        run: npm run perf:budget

      - name: Check image budget
        if: ${{ !cancelled() }}
        run: npm run perf:images

      - name: Generate perf report
        if: ${{ !cancelled() }}
        run: npm run perf:report

      - name: Upload perf report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-report
          path: artifacts/perf-report.json
          if-no-files-found: ignore
          retention-days: 14

      # Security validation shares the already-installed dependency tree but
      # remains a separate, clearly labelled gate in this single CI check.
      - name: Run security gate
        if: ${{ !cancelled() }}
        run: npm run security:gate

      - name: Generate SBOM
        if: ${{ !cancelled() }}
        run: npm run security:sbom

      - name: Upload SBOM artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      # Syft catalogs the complete repository so this artifact covers the
      # nested edge-proxy npm lock and the Deno lock as well as the app root.
      - name: Generate multi-ecosystem SBOM
        if: ${{ !cancelled() }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # pinned action commit
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/itemtraxx-app-multiroot-sbom.cdx.json
          artifact-name: itemtraxx-app-multiroot-sbom.cdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Validate multi-ecosystem SBOM
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from 'node:fs';

          const sbomPath = 'artifacts/itemtraxx-app-multiroot-sbom.cdx.json';
          const sbomBytes = statSync(sbomPath).size;
          if (sbomBytes === 0) throw new Error('Generated SBOM is empty');

          const sbom = JSON.parse(readFileSync(sbomPath, 'utf8'));
          if (sbom.bomFormat !== 'CycloneDX') {
            throw new Error(`Unexpected SBOM format: ${sbom.bomFormat}`);
          }
          if (!Array.isArray(sbom.components) || sbom.components.length === 0) {
            throw new Error('Generated SBOM has no dependency components');
          }
          if (!sbom.components.some((component) =>
            (component.purl ?? '').startsWith('pkg:npm/'))
          ) {
            throw new Error('SBOM has no npm package components');
          }
          if (!sbom.components.some((component) =>
            (component.purl ?? '').startsWith('pkg:github/'))
          ) {
            throw new Error('SBOM has no GitHub Actions components');
          }

          const rootLock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const edgeLock = JSON.parse(
            readFileSync('cloudflare/edge-proxy/package-lock.json', 'utf8'),
          );
          const denoLock = JSON.parse(readFileSync('deno.lock', 'utf8'));

          function packageNameFromLockPath(lockPath) {
            const segments = lockPath.split('node_modules/').at(-1).split('/');
            return segments[0].startsWith('@')
              ? segments.slice(0, 2).join('/')
              : segments[0];
          }

          function npmLockEntries(lock) {
            return Object.entries(lock.packages ?? {})
              .filter(([lockPath]) => lockPath.includes('node_modules/'))
              .map(([lockPath, pkg]) => ({
                name: packageNameFromLockPath(lockPath),
                version: pkg.version,
                optional: pkg.optional === true,
              }));
          }

          const rootEntries = npmLockEntries(rootLock);
          const edgeEntries = npmLockEntries(edgeLock);
          const rootEntryKeys = new Set(
            rootEntries.map(({ name, version }) => `${name}@${version}`),
          );
          const edgeUnique = edgeEntries.find(
            ({ name, version, optional }) =>
              !optional && !rootEntryKeys.has(`${name}@${version}`),
          );
          if (!edgeUnique) {
            throw new Error('Could not identify an edge-proxy-specific lock entry');
          }

          const allNpmLockEntries = new Set(
            [...rootEntries, ...edgeEntries].map(
              ({ name, version }) => `${name}@${version}`,
            ),
          );
          const denoUnique = Object.keys(denoLock.npm ?? {})
            .map((entry) => {
              const match = entry.match(/^(@[^/]+\/[^@]+|[^@]+)@([^_]+)/);
              return match ? { name: match[1], version: match[2] } : undefined;
            })
            .find(
              (entry) =>
                entry &&
                !allNpmLockEntries.has(`${entry.name}@${entry.version}`),
            );
          if (!denoUnique) {
            throw new Error('Could not identify a Deno-lock-specific npm entry');
          }

          for (const expected of [edgeUnique, denoUnique]) {
            const represented = sbom.components.some(
              (component) =>
                component.name === expected.name &&
                component.version === expected.version,
            );
            if (!represented) {
              throw new Error(
                `SBOM does not represent lock entry ${expected.name}@${expected.version}`,
              );
            }
          }

          console.log(
            `Validated ${sbom.components.length} components in ${sbomPath}; includes edge-proxy and Deno lock entries.`,
          );
          NODE

      - name: Upload multi-ecosystem SBOM artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: itemtraxx-app-multiroot-sbom
          path: artifacts/itemtraxx-app-multiroot-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      # Use Chrome Stable from Google's distribution so browser security fixes
      # are current even when Playwright's bundled Chromium revision lags.
      - name: Install Chrome Stable for Playwright
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: npx playwright install chrome --force

      - name: Verify Chrome Stable version
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          const metadataUrl = 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json';
          const response = await fetch(metadataUrl, { signal: AbortSignal.timeout(15_000) });
          if (!response.ok) {
            throw new Error(`Chrome for Testing metadata request failed with HTTP ${response.status}`);
          }

          const metadata = await response.json();
          const expected = metadata?.channels?.Stable?.version;
          if (typeof expected !== 'string' || !/^\d+\.\d+\.\d+\.\d+$/.test(expected)) {
            throw new Error('Chrome for Testing Stable version was unavailable or invalid');
          }

          const output = execFileSync('google-chrome', ['--version'], { encoding: 'utf8' }).trim();
          const actual = output.match(/\d+\.\d+\.\d+\.\d+/)?.[0];
          if (!actual) {
            throw new Error(`Could not parse installed Chrome version from: ${output}`);
          }
          if (actual !== expected) {
            throw new Error(`Installed Chrome ${actual} does not match Chrome for Testing Stable ${expected}`);
          }

          console.log(`Verified installed Chrome ${actual} matches Chrome for Testing Stable.`);
          NODE

      - name: Install Playwright system dependencies
        if: ${{ !cancelled() }}
        run: |
          timeout 180s npx playwright install-deps chromium || {
            echo "::warning::Playwright system dependency install failed or timed out; continuing so E2E can verify whether the runner already has the required libraries."
          }

      - name: Run E2E tests
        if: ${{ !cancelled() }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      # Failure alerting runs in the trusted workflow_run workflow so this
      # PR-controlled runner never receives incident.io credentials.
