version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "cron"
      cronjob: "0 6 */2 * *"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
      # posthog-js ships several releases a week, so a 7-day cooldown keeps the
      # app permanently behind and trips the PostHog "SDK outdated" health check.
      exclude:
        - "posthog-js"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vue-router"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-and-yarn:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "cron"
      cronjob: "30 6 */2 * *"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
