name: Deno Lock Sync

# Any npm dependency bump (Dependabot or manual) touches package.json /
# package-lock.json but never deno.lock, so the `deno check --frozen` steps
# in CI Core fail. This workflow regenerates deno.lock to match and commits
# it back — on Dependabot PRs, human PRs, and direct pushes to any branch.
#
# Push uses a fine-grained PAT (secret ITX_DEPENDABOT_PAT, Contents:
# read/write on this repo). A PAT is required because:
#   - Dependabot `pull_request` runs only see Dependabot secrets, not Actions secrets.
#   - Pushes made with the default GITHUB_TOKEN cannot re-trigger CI Core, so the
#     final commit would sit with no passing checks. A PAT push re-triggers CI Core,
#     which then passes because the lock is in sync.
#
# Loop-safe: the bot's own commit only touches deno.lock, never package.json/
# package-lock.json, so it never re-triggers this workflow's path filter.
#
# Safe by construction: `deno install --lockfile-only` resolves registry
# metadata without running any install/postinstall scripts or executing
# package code.
#
# Fork PRs are excluded (job `if` below): this checks out the PR head with a
# write-scoped PAT and pushes back to it. For a same-repo branch that's fine
# (only org members can push branches here). For a fork PR, the head repo is
# attacker-controlled — checking it out and pushing with our PAT would hand
# a write-capable credential's actions to that content. Fork PRs still get
# CI Core's frozen-lockfile failure as a signal; a maintainer can push the
# branch or re-run manually to sync it.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
  push:
    paths:
      - package.json
      - package-lock.json

concurrency:
  group: deno-lock-sync-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    # Skip fork PRs — see note above. Same-repo PRs and direct pushes proceed.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.ITX_DEPENDABOT_PAT }}
          persist-credentials: true

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.x
          cache: true

      - name: Regenerate deno.lock from package.json
        # --min-dep-age=0 disables Deno's minimum-dependency-age gate, which would
        # otherwise refuse to lock versions published <24h ago and silently no-op —
        # exactly the case that matters, since Dependabot bumps to just-published
        # versions. Safe here: the target versions are already resolved and pinned by
        # npm in package-lock.json, so syncing deno.lock to match is format parity,
        # not a new trust decision.
        run: deno install --lockfile-only --min-dep-age=0

      - name: Verify deno.lock is now in sync
        # Fail loudly if the lock still does not match package.json (e.g. a resolution
        # deno could not satisfy), instead of committing an out-of-date lock.
        run: deno install --lockfile-only --frozen --min-dep-age=0

      - name: Commit and push if deno.lock changed
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet -- deno.lock; then
            echo "deno.lock already in sync — nothing to commit."
            exit 0
          fi
          git config user.name "itemtraxx-deno-lock-sync[bot]"
          git config user.email "deno-lock-sync@itemtraxx.com"
          git add deno.lock
          git commit -m "chore(deps): sync deno.lock with npm bump"
          git push origin "HEAD:$HEAD_REF"
