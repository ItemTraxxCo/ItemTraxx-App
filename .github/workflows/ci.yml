name: CI

permissions:
  actions: read
  contents: read
  pull-requests: read

on:
  pull_request:
  push:
    branches:
      - main
      - preview
      - staging
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  require-trusted-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow dispatch ref
        id: guard
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$RUN_EVENT" == "workflow_dispatch" && "$RUN_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual CI runs must use refs/heads/main."
            exit 1
          fi

  kill-switch-preflight:
    # GitHub-hosted runners receive a Cloudflare challenge (HTTP 403) from
    # the edge system-status URL. Use the direct Supabase origin while
    # keeping CI fail-closed on an unknown state.
    needs: require-trusted-ref
    uses: ./.github/workflows/kill-switch-preflight.yml
    with:
      status_source: supabase

  slack-notify-start:
    needs:
      - require-trusted-ref
      - kill-switch-preflight
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/slack-notify-status.yml
    with:
      mode: start
      workflow_name: CI
      job_name: validate
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref_name: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      incident_alerts_enabled: false
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  validate:
    needs:
      - require-trusted-ref
      - kill-switch-preflight
      - slack-notify-start
    if: ${{ always() && needs.require-trusted-ref.result == 'success' && needs.kill-switch-preflight.outputs.active == 'false' && (needs.slack-notify-start.result == 'success' || needs.slack-notify-start.result == 'skipped') }}
    uses: ./.github/workflows/ci-validation.yml
    with:
      ref: ${{ github.sha }}
      diff_base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
      diff_head_sha: ${{ github.sha }}

  slack-notify-finish:
    needs:
      - require-trusted-ref
      - kill-switch-preflight
      - slack-notify-start
      - validate
    # Always finish the single CI status message when the start message exists.
    # A kill-switch block is reported in that same message instead of creating
    # a second, normally skipped, notification check.
    if: ${{ always() && github.event_name != 'pull_request' && needs.require-trusted-ref.result == 'success' && needs.slack-notify-start.result == 'success' }}
    uses: ./.github/workflows/slack-notify-status.yml
    with:
      mode: finish
      workflow_name: CI
      job_name: validate
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref_name: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      status: ${{ needs.validate.result == 'success' && 'success' || needs.validate.result == 'failure' && 'failure' || needs.validate.result == 'cancelled' && 'cancelled' || needs.kill-switch-preflight.outputs.active == 'true' && 'success' || 'failure' }}
      status_message: ${{ needs.validate.result == 'skipped' && needs.kill-switch-preflight.outputs.active == 'true' && format('Intentionally skipped because the ItemTraxx kill switch is active. {0}', needs.kill-switch-preflight.outputs.message) || needs.validate.result == 'skipped' && format('Validation was blocked because kill-switch preflight returned {0}. {1}', needs.kill-switch-preflight.outputs.active, needs.kill-switch-preflight.outputs.message) || '' }}
      slack_channel_id: ${{ needs.slack-notify-start.outputs.slack_channel_id }}
      slack_message_ts: ${{ needs.slack-notify-start.outputs.slack_message_ts }}
      incident_alerts_enabled: false
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
